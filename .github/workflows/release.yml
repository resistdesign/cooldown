name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - run: gradle build
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name 'cooldown-*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          gh release create "$GITHUB_REF_NAME" "$JAR" --generate-notes --title "COOLDOWN $GITHUB_REF_NAME"
